# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Check and configure Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Repository: ${{ github.repository }}"
            echo "Get Pages:"
            gh api repos/${{ github.repository }}/pages
            echo "Set Pages build type to workflow:"
            gh api --method PUT repos/${{ github.repository }}/pages --raw-field build_type=workflow
          } > pages-report.txt 2>&1 || true
          content=$(base64 -w 0 pages-report.txt)
          sha=$(gh api "repos/${{ github.repository }}/contents/pages-report.txt" --jq '.sha' 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/${{ github.repository }}/contents/pages-report.txt" -f message="Report Pages status [skip ci]" -f content="$content" -f branch=master -f sha="$sha"
          else
            gh api --method PUT "repos/${{ github.repository }}/contents/pages-report.txt" -f message="Report Pages status [skip ci]" -f content="$content" -f branch=master
          fi
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5