name: Build and deploy LJT-Homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Deploy to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          keep_files: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
      - name: Report Pages status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pages > pages-status.txt 2>&1 || true
          content=$(base64 -w 0 pages-status.txt)
          sha=$(gh api "repos/${{ github.repository }}/contents/pages-status.txt" --jq '.sha' 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/${{ github.repository }}/contents/pages-status.txt" -f message="Report Pages status [skip ci]" -f content="$content" -f branch=master -f sha="$sha"
          else
            gh api --method PUT "repos/${{ github.repository }}/contents/pages-status.txt" -f message="Report Pages status [skip ci]" -f content="$content" -f branch=master
          fi